<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovasi Kertgondozás - Kert AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="fejlec">

<img src="kepek/logo.png" class="logo">

<h1>Lovasi Kertgondozás</h1>

<p>
Kertfelmérés mesterséges intelligenciával
</p>

</header>


<section class="hero" aria-label="Lovasi Kertgondozás">
</section>

<div class="doboz">


<h2>Kert képek feltöltése</h2>


<input 
type="file"
id="kepek"
multiple
accept="image/*">





<h2>Milyen munkára van szüksége?</h2>


<div class="munkak">



<div class="kartya">

<img src="kepek/funyiras.jpg">

<label>

<input type="checkbox" value="Fűnyírás">

Fűnyírás

</label>

</div>




<div class="kartya">

<img src="kepek/viragagyas.jpg">

<label>

<input type="checkbox" value="Virágágyások gondozása">

Virágágyások gondozása

</label>

</div>



<div class="kartya">

<img src="kepek/bokor.jpg">

<label>

<input type="checkbox" value="Bokrok metszése">

Bokrok metszése

</label>

</div>





<div class="kartya">

<img src="kepek/bozot.jpg">

<label>

<input type="checkbox" value="Bozót irtás">

Bozót irtás

</label>

</div>





<div class="kartya">

<img src="kepek/fakivagas.jpg">

<label>

<input type="checkbox" value="Fakivágás">

Fakivágás

</label>

</div>



</div>

<h2>Település</h2>

<input
type="text"
id="telepules"
placeholder="Pl. Lovas"
required>


<h2>Név</h2>

<input
type="text"
id="nev"
placeholder="Név">



<h2>Email cím / Telefonszám </h2>

<input 
    type="email"
    id="email"
    name="email"
    placeholder="Email cím"
    autocomplete="email"
    required>


<h2>Megjegyzés</h2>


<textarea

id="megjegyzes"

placeholder="Írjon pár információt a kertről, helyszínről vagy elképzeléséről">

</textarea>





<button type="button" id="ajanlatGomb">
    Ajánlat kérése
</button>





<div id="eredmeny"></div>



</div>







<script>

document.getElementById("ajanlatGomb").addEventListener("click", kuldes);

async function kuldes() {

    const email = document.getElementById("email").value.trim();
    const telepules = document.getElementById("telepules").value.trim();

    // EMAIL ELLENŐRZÉS
    if (email === "") {
        alert("Az email cím megadása kötelező!");
        document.getElementById("email").focus();
        return;
    }

    // TELEPÜLÉS ELLENŐRZÉS
    if (telepules === "") {
        alert("A település megadása kötelező!");
        document.getElementById("telepules").focus();
        return;
    }

    // KÉPEK
    let fajlok = document.getElementById("kepek").files;

    let adat = new FormData();

    for (let i = 0; i < fajlok.length; i++) {
        adat.append("kepek", fajlok[i]);
    }

    // MUNKÁK
    let munkak = [];

    document
        .querySelectorAll('input[type="checkbox"]:checked')
        .forEach(elem => {
            munkak.push(elem.value);
        });

    adat.append(
        "munkak",
        munkak.join(", ")
    );

    // MEGJEGYZÉS
    adat.append(
        "megjegyzes",
        document.getElementById("megjegyzes").value
    );

    // EMAIL
    adat.append(
        "email",
        email
    );

    // TELEPÜLÉS
    adat.append(
        "telepules",
        telepules
    );

    // NÉV
    adat.append(
        "nev",
        document.getElementById("nev").value
    );

    // EREDMÉNY
    let eredmeny = document.getElementById("eredmeny");

    eredmeny.innerHTML = "Elemzés folyamatban...";

    try {

        let valasz = await fetch("/elemzes", {
            method: "POST",
            body: adat
        });

        let json = await valasz.json();

        eredmeny.innerHTML =
            json.eredmeny || json.hiba;

    }

    catch (e) {

        console.error(e);

        eredmeny.innerHTML =
            "Hiba történt a kapcsolat során.";

    }

}

</script>


</body>

</html>
